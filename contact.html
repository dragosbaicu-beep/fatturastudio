<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Fattura Studio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
</head>
<body class="contact-page">

  <!-- ══ NAVBAR ══════════════════════════════════════ -->
  <nav class="navbar navbar--dark" id="navbar">
    <div class="nav-inner">
      <ul class="nav-links">
        <li><a href="projects.html">Projects</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
      <a href="index.html" class="nav-brand">Fattura Studio</a>
    </div>
  </nav>

  <!-- ══ PAGE HEADER ═════════════════════════════════ -->
  <header class="page-header fade-in">
    <span class="label">Get in touch</span>
    <h1>Contact</h1>
  </header>

  <!-- ══ CONTACT CONTENT ════════════════════════════ -->
  <div class="contact-content fade-in fade-in--delay">

    <!-- Instagram -->
    <div class="contact-instagram">
      <span class="label">Instagram</span>
      <a
        href="https://www.instagram.com/fattura_studio?igsh=d2g1OWc1dHh1ODM="
        target="_blank"
        rel="noopener noreferrer"
      >@fattura_studio</a>
    </div>

    <!-- Contacts grid — 3 columns, no names -->
    <div class="contact-grid">

      <div class="contact-col">
        <span class="label">Email</span>
        <a href="mailto:info@fatturastudio.com" class="contact-item">
          info@fatturastudio.com
        </a>
        <a href="mailto:press@fatturastudio.com" class="contact-item">
          press@fatturastudio.com
        </a>
      </div>

      <div class="contact-col">
        <span class="label">Phone</span>
        <a href="tel:+390212345678" class="contact-item">
          +39 02 1234 5678
        </a>
        <a href="tel:+393334567890" class="contact-item">
          +39 333 456 7890
        </a>
      </div>

      <div class="contact-col">
        <span class="label">Based in</span>
        <span class="contact-item">Milan — Italy</span>
        <span class="contact-item">Available worldwide</span>
      </div>

    </div>

  </div>

  <!-- ══ FOOTER ═══════════════════════════════════════ -->
  <footer class="footer">
    <span class="label">© 2024 Fattura Studio</span>
    <span class="label">Milan — Italy</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
